name: HwpStudio
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    HEADER_SEARCH_PATHS: '$(inherited) $(SRCROOT)/Generated'
targets:
  HwpStudio:
    type: application
    platform: macOS
    sources: [App]
    configFiles:
      Debug: Config/Dependencies.xcconfig
      Release: Config/Dependencies.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hwpstudio.mac
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HwpStudio
        INFOPLIST_KEY_LSMinimumSystemVersion: '14.0'
        SWIFT_OBJC_BRIDGING_HEADER: Config/HwpStudio-Bridging-Header.h
    entitlements:
      path: Config/HwpStudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    preBuildScripts:
      - name: Build Rust engine and generate ABI
        script: '"${SRCROOT}/scripts/build-engine.sh"'
        basedOnDependencyAnalysis: false
  HwpStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies: [{target: HwpStudio}]
schemes:
  HwpStudio:
    build:
      targets:
        HwpStudio: all
    test:
      targets: [HwpStudioTests]
