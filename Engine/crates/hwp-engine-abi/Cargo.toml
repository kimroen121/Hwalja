[package]
name = "hwp-engine-abi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-segmentation = "1.13.3"
roxmltree = "0.20"
svgtypes = "0.15.3"
ttf-parser = "0.25"
rhwp = { path = "../../../build/rhwp", default-features = false }

[features]
skia = ["rhwp/native-skia"]
